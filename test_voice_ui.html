<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Enabled RAG STT Tester</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #1e1e24;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid #2e2e38;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            color: #00b4d8;
        }
        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #8c8c9a;
            margin-top: 0;
            margin-bottom: 35px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #recordBtn {
            background-color: #e63946;
            color: white;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }
        #recordBtn.recording {
            background-color: #457b9d;
            animation: pulse 1.5s infinite;
            box-shadow: 0 4px 15px rgba(69, 123, 157, 0.4);
        }
        #recordBtn:disabled {
            background-color: #444;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #statusText {
            font-size: 14px;
            font-weight: bold;
            color: #ffb703;
        }
        .results-box {
            background-color: #121214;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2e2e38;
            margin-bottom: 20px;
            min-height: 120px;
        }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8c8c9a;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .output-text {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #f8f9fa;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .metric-card {
            background: #25252e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2e2e38;
        }
        .metric-label {
            font-size: 11px;
            color: #8c8c9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .metric-val {
            font-size: 18px;
            font-weight: 700;
            color: #00f5d4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ Voice-Enabled RAG STT Tester</h1>
    <p class="subtitle">Record query from browser mic and stream grounding decisions</p>
    
    <div class="controls">
        <button id="recordBtn">Start Recording</button>
        <div id="statusText">Ready</div>
    </div>
    
    <div class="results-box">
        <div class="section-title">Transcribed Query</div>
        <div id="queryText" class="output-text" style="color: #00b4d8;">-</div>
    </div>
    
    <div class="results-box">
        <div class="section-title">Grounded RAG Answer</div>
        <div id="answerText" class="output-text">-</div>
    </div>
    
    <div class="results-box">
        <div class="section-title">Guardrail Logs</div>
        <div id="guardrailLogs" class="output-text" style="font-family: monospace; font-size: 13px; color: #ffb703;">-</div>
    </div>
    
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">STT Round-Trip Latency</div>
            <div id="sttLatency" class="metric-val">-</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Retrieval Latency</div>
            <div id="retrievalLatency" class="metric-val">-</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Embedding Relevance Score</div>
            <div id="relevanceScore" class="metric-val">-</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Grounding Check Score</div>
            <div id="groundingScore" class="metric-val">-</div>
        </div>
    </div>
</div>

<script>
    let mediaRecorder = null;
    let audioChunks = [];
    const recordBtn = document.getElementById("recordBtn");
    const statusText = document.getElementById("statusText");
    const queryText = document.getElementById("queryText");
    const answerText = document.getElementById("answerText");
    const guardrailLogs = document.getElementById("guardrailLogs");
    const sttLatency = document.getElementById("sttLatency");
    const retrievalLatency = document.getElementById("retrievalLatency");
    const relevanceScore = document.getElementById("relevanceScore");
    const groundingScore = document.getElementById("groundingScore");

    recordBtn.addEventListener("click", async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            // Start recording
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendAudio(audioBlob);
                };
                
                mediaRecorder.start();
                recordBtn.textContent = "Stop Recording";
                recordBtn.classList.add("recording");
                statusText.textContent = "Recording...";
            } catch (err) {
                alert("Error accessing microphone: " + err.message);
            }
        } else {
            // Stop recording
            mediaRecorder.stop();
            recordBtn.disabled = true;
            recordBtn.textContent = "Processing...";
            recordBtn.classList.remove("recording");
            statusText.textContent = "Sending to backend...";
        }
    });

    async function sendAudio(blob) {
        queryText.textContent = "Transcribing...";
        answerText.textContent = "Waiting for transcription...";
        guardrailLogs.textContent = "";
        sttLatency.textContent = "-";
        retrievalLatency.textContent = "-";
        relevanceScore.textContent = "-";
        groundingScore.textContent = "-";

        const formData = new FormData();
        formData.append("file", blob, "query.wav");

        try {
            const response = await fetch("http://127.0.0.1:8000/api/query-voice", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            // Read the Server-Sent Events stream manually
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop(); // Keep partial line in buffer

                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        const jsonStr = line.substring(6);
                        try {
                            const data = JSON.parse(jsonStr);
                            handleEvent(data);
                        } catch (e) {
                            console.error("Parse error:", e);
                        }
                    }
                }
            }
        } catch (err) {
            statusText.textContent = "Error";
            answerText.textContent = "Error: " + err.message;
        } finally {
            recordBtn.disabled = false;
            recordBtn.textContent = "Start Recording";
            statusText.textContent = "Ready";
        }
    }

    function handleEvent(data) {
        const event = data.event;
        
        if (event === "stt_complete") {
            queryText.textContent = data.text;
            sttLatency.textContent = `${data.latency_ms.toFixed(2)} ms`;
        } else if (event === "retrieval_complete") {
            retrievalLatency.textContent = `${data.retrieval_ms.toFixed(2)} ms`;
            relevanceScore.textContent = data.relevance_score.toFixed(4);
            guardrailLogs.textContent += `[Retrieval] Language: ${data.language.toUpperCase()} | Relevance: ${data.relevance_score.toFixed(4)} (${data.retrieval_ms.toFixed(1)} ms)\n`;
        } else if (event === "generation_start") {
            answerText.textContent = "Generating answer...";
            guardrailLogs.textContent += `[LLM] Request accepted (TTFT: ${data.ttft_ms.toFixed(1)} ms)\n`;
        } else if (event === "borderline_evaluation") {
            guardrailLogs.textContent += `[Guardrail] Borderline Similarity: ${data.score.toFixed(4)}. Running LLM evaluator...\n`;
        } else if (event === "grounding_complete") {
            groundingScore.textContent = data.score ? data.score.toFixed(4) : "N/A";
            answerText.textContent = data.answer;
            guardrailLogs.textContent += `[Guardrail] Status: ${data.status} | Score: ${data.score ? data.score.toFixed(4) : 'N/A'} (${data.latency_s.toFixed(2)} s)\n`;
        } else if (event === "stt_error") {
            queryText.textContent = "[STT Error / Timeout]";
            sttLatency.textContent = `${data.latency_ms.toFixed(2)} ms`;
            answerText.textContent = data.fallback_answer;
            guardrailLogs.textContent += `[STT Error] Call failed or timed out.\n`;
        } else if (event === "silent_audio") {
            queryText.textContent = "[Empty / Silent Audio]";
            sttLatency.textContent = `${data.latency_ms.toFixed(2)} ms`;
            answerText.textContent = data.fallback_answer;
            guardrailLogs.textContent += `[STT Warning] Audio contained no spoken words.\n`;
        } else if (event === "safety_block") {
            queryText.textContent = "[Blocked Pre-Retrieval]";
            answerText.textContent = data.fallback_answer;
            guardrailLogs.textContent += `[Safety Blocked] Danger category match detected.\n`;
        } else if (event === "error") {
            answerText.textContent = "Server Error: " + data.message;
        }
    }
</script>
</body>
</html>
