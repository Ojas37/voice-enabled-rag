services:
  - type: web
    name: voice-rag-pipeline
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python deploy_bootstrap.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANCE_DB_DOWNLOAD_URL
        sync: false
